[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasound-privacy-utility-benchmark"
version = "0.1.0"
description = "Privacy-utility benchmark and local review workbench for ultrasound AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "Pillow>=10,<12",
  "pydantic>=2.8,<3",
  "pydicom>=3,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

ai = [
  "monai>=1.5,<2",
  "torch>=2.0,<3",
]

ocr = [
  "pytesseract>=0.3.10,<1",
  "opencv-python-headless>=4.8,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
